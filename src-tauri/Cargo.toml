[package]
name = "dragon-fruit-dashboard"
version = "0.1.0"
description = "Dragon Fruit Dashboard"
authors = ["Reyna"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dragon_fruit_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
